<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wach Katbghini? 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --rose: #ff4d7d;
      --deep: #1a0a14;
      --pink-soft: #ffe0ec;
      --gold: #f9c74f;
      --purple: #9b5de5;
      --star: rgba(255,255,255,0.85);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--deep);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── Stars ─────────────────────────────────────────── */
    .stars {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .star {
      position: absolute;
      width: 3px; height: 3px;
      background: var(--star);
      border-radius: 50%;
      animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.2; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.6); }
    }

    /* ── Floating hearts ────────────────────────────────── */
    .heart-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .fheart {
      position: absolute; bottom: -60px;
      font-size: var(--s, 1.4rem);
      animation: floatUp var(--fd, 8s) ease-in infinite var(--fd2, 0s);
      opacity: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
    }

    /* ── Card ───────────────────────────────────────────── */
    #main-card {
      position: relative; z-index: 10;
      background: linear-gradient(145deg, rgba(30,10,25,0.95), rgba(50,10,40,0.9));
      border: 1.5px solid rgba(255,77,125,0.35);
      border-radius: 28px;
      padding: 56px 48px 48px;
      max-width: 520px; width: 92%;
      text-align: center;
      box-shadow: 0 0 80px rgba(255,77,125,0.18), 0 0 160px rgba(155,93,229,0.1);
      backdrop-filter: blur(12px);
      animation: cardIn 1.2s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(60px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── Big heart pulse ────────────────────────────────── */
    .big-heart {
      font-size: 5rem;
      display: inline-block;
      animation: heartbeat 1.4s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255,77,125,0.9));
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      14%     { transform: scale(1.22); }
      28%     { transform: scale(1.08); }
      42%     { transform: scale(1.18); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #fff;
      margin: 20px 0 10px;
      line-height: 1.15;
      text-shadow: 0 0 30px rgba(255,77,125,0.7);
      animation: fadeSlide 1s 0.5s both;
    }
    .subtitle {
      color: rgba(255,220,235,0.65);
      font-size: 1rem;
      letter-spacing: 0.06em;
      margin-bottom: 38px;
      animation: fadeSlide 1s 0.8s both;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Buttons ────────────────────────────────────────── */
    .btn-group {
      display: flex; gap: 18px; justify-content: center; flex-wrap: wrap;
      animation: fadeSlide 1s 1.1s both;
    }
    .btn {
      padding: 14px 38px;
      border: none; cursor: pointer;
      border-radius: 50px;
      font-family: 'Tajawal', sans-serif;
      font-size: 1.15rem; font-weight: 700;
      letter-spacing: 0.04em;
      transition: transform .2s, box-shadow .2s, filter .2s;
      position: relative; overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.12);
      opacity: 0;
      transition: opacity .2s;
    }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.95) !important; }

    .btn-yes {
      background: linear-gradient(135deg, #ff4d7d, #ff85a1);
      color: #fff;
      box-shadow: 0 6px 28px rgba(255,77,125,0.55);
    }
    .btn-yes:hover {
      transform: scale(1.08) translateY(-3px);
      box-shadow: 0 12px 36px rgba(255,77,125,0.7);
    }
    .btn-no {
      background: linear-gradient(135deg, #2d1f3d, #4a2560);
      color: rgba(255,255,255,0.75);
      border: 1px solid rgba(155,93,229,0.4);
      box-shadow: 0 4px 18px rgba(155,93,229,0.2);
    }
    .btn-no:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 8px 28px rgba(155,93,229,0.4);
      color: #fff;
    }

    /* ── Response screens ───────────────────────────────── */
    #response-yes, #response-no {
      display: none;
      animation: popIn .7s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* YES */
    .yes-msg {
      font-family: 'Dancing Script', cursive;
      font-size: 2.4rem;
      color: #fff;
      line-height: 1.4;
      text-shadow: 0 0 30px rgba(255,77,125,0.8);
      margin: 22px 0 10px;
    }
    .yes-sub {
      color: rgba(255,220,235,0.7);
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .sparkle-row {
      font-size: 2rem;
      letter-spacing: 0.3em;
      animation: sparkleLoop 2s ease-in-out infinite;
    }
    @keyframes sparkleLoop {
      0%,100% { filter: brightness(1); }
      50%      { filter: brightness(1.6) drop-shadow(0 0 8px gold); }
    }

    /* Confetti */
    .confetti-wrap {
      position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden;
    }
    .conf {
      position: absolute; top: -20px;
      width: 10px; height: 14px;
      border-radius: 2px;
      animation: confFall var(--cf, 3s) ease-in infinite var(--cf2, 0s);
      opacity: 0;
    }
    @keyframes confFall {
      0%   { transform: translateY(-20px) rotate(0deg)   scaleX(1);   opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg) scaleX(-1);  opacity: 0; }
    }

    /* NO – Wolf */
    .wolf-wrap {
      position: relative; display: inline-block;
      margin: 16px 0;
    }
    .wolf-svg {
      width: 180px; height: 180px;
      filter: drop-shadow(0 0 20px rgba(100,80,160,0.5));
      animation: wolfSad 3s ease-in-out infinite;
    }
    @keyframes wolfSad {
      0%,100% { transform: translateY(0) rotate(-1deg); }
      50%      { transform: translateY(-8px) rotate(1deg); }
    }
    /* Tear drop */
    .tear {
      position: absolute;
      width: 8px; height: 12px;
      background: linear-gradient(to bottom, #7ecef4, #4fa3d1);
      border-radius: 50% 50% 60% 60%;
      animation: tearDrop 2.2s ease-in infinite;
      opacity: 0;
    }
    .tear1 { left: 62px; top: 96px; animation-delay: 0s; }
    .tear2 { left: 110px; top: 98px; animation-delay: 1.1s; }
    @keyframes tearDrop {
      0%   { opacity: 0;   transform: translateY(0) scaleX(1); }
      10%  { opacity: 1; }
      100% { opacity: 0;   transform: translateY(40px) scaleX(0.7); }
    }

    .no-msg {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: rgba(200,180,220,0.9);
      margin: 8px 0 6px;
      text-shadow: 0 0 20px rgba(155,93,229,0.6);
    }
    .no-sub {
      color: rgba(200,180,220,0.55);
      font-size: 0.95rem;
    }

    /* back btn */
    .btn-back {
      margin-top: 28px;
      padding: 10px 28px;
      background: transparent;
      border: 1px solid rgba(255,77,125,0.4);
      color: rgba(255,180,200,0.7);
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.9rem;
      transition: all .2s;
    }
    .btn-back:hover {
      border-color: var(--rose);
      color: #fff;
      background: rgba(255,77,125,0.12);
    }

    /* ── Ripple on yes click ────────────────────────────── */
    .ripple {
      position: fixed; pointer-events: none; z-index: 5;
      border-radius: 50%;
      transform: scale(0);
      border: 3px solid rgba(255,77,125,0.6);
      animation: rippleAnim 1s ease-out forwards;
    }
    @keyframes rippleAnim {
      to { transform: scale(60); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>
<!-- Floating hearts -->
<div class="heart-bg" id="hearts"></div>
<!-- Confetti (hidden by default) -->
<div class="confetti-wrap" id="confetti"></div>

<!-- ── MAIN CARD ── -->
<div id="main-card">

  <!-- Question screen -->
  <div id="question-screen">
    <div class="big-heart">💗</div>
    <h1>Wach Katbghini?</h1>
    <p class="subtitle">jawbi alhbiba dyali ✨</p>
    <div class="btn-group">
      <button class="btn btn-yes" onclick="handleYes(this)">💖 Iyeh, Kanbghik!</button>
      <button class="btn btn-no" onclick="handleNo()">😶 La...</button>
    </div>
  </div>

  <!-- YES response -->
  <div id="response-yes">
    <div class="sparkle-row">✨💖✨</div>
    <p class="yes-msg">Hta Ana Kanbghik A Hyati<br>ou Kanmout 3lik 🌹</p>
    <p class="yes-sub">Dak chi li bgha 9albi ysm3o 🥺💕</p>
    <div class="sparkle-row" style="margin-top:10px">🌹💌🌙</div>
    <br>
    <button class="btn-back" onclick="goBack()">↩ Rj3 lwest</button>
  </div>

  <!-- NO response -->
  <div id="response-no">
    <div class="wolf-wrap">
      <!-- SVG Wolf sad face -->
      <svg class="wolf-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- body -->
        <ellipse cx="100" cy="145" rx="48" ry="36" fill="#6b5b95"/>
        <!-- head -->
        <ellipse cx="100" cy="95" rx="46" ry="44" fill="#7d6ba0"/>
        <!-- ears left -->
        <polygon points="58,62 48,28 78,52" fill="#6b5b95"/>
        <polygon points="62,60 54,36 76,54" fill="#c49bc7"/>
        <!-- ears right -->
        <polygon points="142,62 152,28 122,52" fill="#6b5b95"/>
        <polygon points="138,60 146,36 124,54" fill="#c49bc7"/>
        <!-- muzzle -->
        <ellipse cx="100" cy="108" rx="26" ry="18" fill="#c49bc7"/>
        <!-- nose -->
        <ellipse cx="100" cy="98" rx="8" ry="5.5" fill="#3d2b4f"/>
        <!-- sad eyes left -->
        <ellipse cx="80" cy="84" rx="8" ry="7" fill="#fff"/>
        <ellipse cx="80" cy="86" rx="5" ry="5" fill="#3d2b4f"/>
        <ellipse cx="78" cy="84" rx="2" ry="2" fill="#fff" opacity=".6"/>
        <!-- sad eyes right -->
        <ellipse cx="120" cy="84" rx="8" ry="7" fill="#fff"/>
        <ellipse cx="120" cy="86" rx="5" ry="5" fill="#3d2b4f"/>
        <ellipse cx="118" cy="84" rx="2" ry="2" fill="#fff" opacity=".6"/>
        <!-- sad eyebrows -->
        <path d="M74 76 Q80 73 86 76" stroke="#4a3060" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M114 76 Q120 73 126 76" stroke="#4a3060" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- sad mouth -->
        <path d="M88 116 Q100 110 112 116" stroke="#4a3060" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- tail -->
        <path d="M148 145 Q180 130 175 108 Q170 92 160 100" stroke="#6b5b95" stroke-width="14" fill="none" stroke-linecap="round"/>
        <!-- paws -->
        <ellipse cx="72" cy="172" rx="18" ry="10" fill="#6b5b95"/>
        <ellipse cx="128" cy="172" rx="18" ry="10" fill="#6b5b95"/>
      </svg>
      <div class="tear tear1"></div>
      <div class="tear tear2"></div>
    </div>
    <p class="no-msg">Alah akbar 🐺💔</p>
    <p class="no-sub">yarbi nkon kan7lm</p>
    <br>
    <button class="btn-back" onclick="goBack()">↩ Rj3i ahbiba — bach tbdli jawabok 😅</button>
  </div>

</div>

<script>
  /* ── Stars ── */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;
      --d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;
      width:${Math.random()<0.2?4:2}px;height:${Math.random()<0.2?4:2}px`;
    starsEl.appendChild(s);
  }

  /* ── Floating hearts ── */
  const heartsEl = document.getElementById('hearts');
  const hChars = ['💕','💗','💓','💖','🌹','✨','💝','🩷'];
  for (let i = 0; i < 18; i++) {
    const h = document.createElement('div');
    h.className = 'fheart';
    h.textContent = hChars[Math.floor(Math.random()*hChars.length)];
    h.style.cssText = `left:${Math.random()*100}%;
      --s:${0.9+Math.random()*1.6}rem;
      --fd:${6+Math.random()*8}s;
      --fd2:${Math.random()*8}s`;
    heartsEl.appendChild(h);
  }

  /* ── Confetti ── */
  function buildConfetti() {
    const wrap = document.getElementById('confetti');
    wrap.innerHTML = '';
    const colors = ['#ff4d7d','#f9c74f','#ff85a1','#c77dff','#90e0ef','#fff'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('div');
      c.className = 'conf';
      c.style.cssText = `left:${Math.random()*100}%;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        --cf:${2+Math.random()*3}s;
        --cf2:${Math.random()*3}s;
        width:${6+Math.random()*10}px;height:${10+Math.random()*14}px;
        border-radius:${Math.random()>0.5?'50%':'2px'}`;
      wrap.appendChild(c);
    }
  }

  /* ── Ripple ── */
  function spawnRipple(x, y) {
    const r = document.createElement('div');
    r.className = 'ripple';
    const size = 60;
    r.style.cssText = `width:${size}px;height:${size}px;
      left:${x - size/2}px;top:${y - size/2}px`;
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 1000);
  }

  /* ── Handlers ── */
  function handleYes(btn) {
    const rect = btn.getBoundingClientRect();
    spawnRipple(rect.left + rect.width/2, rect.top + rect.height/2);
    setTimeout(() => {
      document.getElementById('question-screen').style.display = 'none';
      const yes = document.getElementById('response-yes');
      yes.style.display = 'block';
      buildConfetti();
    }, 200);
  }

  function handleNo() {
    document.getElementById('question-screen').style.display = 'none';
    const no = document.getElementById('response-no');
    no.style.display = 'block';
    document.getElementById('confetti').innerHTML = '';
  }

  function goBack() {
    document.getElementById('response-yes').style.display = 'none';
    document.getElementById('response-no').style.display = 'none';
    document.getElementById('confetti').innerHTML = '';
    const qs = document.getElementById('question-screen');
    qs.style.display = 'block';
    qs.style.animation = 'none';
    void qs.offsetWidth;
    qs.style.animation = 'fadeSlide .5s both';
  }
</script>
</body>
</html>
